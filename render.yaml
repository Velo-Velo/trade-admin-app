# Quotestick on Render. In the Render dashboard: New → Blueprint, then pick this repo.
# This file is only a free web service and free Postgres, so the first deploy has no paid service.
# The free web service sleeps when nobody is using it. Change its plan to 0.5c-512mb
# before customers rely on the public pages.
# Daily reminders are optional and paid. They are not created from this file.
# See render.cron.yaml and README.md.
# npm start applies migrations, loads job templates, and resets the sample trader
# only when DEMO_MODE is exactly true.

databases:
  - name: quotestick-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "16"
    databaseName: quotestick
    user: quotestick
    ipAllowList: []

services:
  - type: web
    name: quotestick
    runtime: node
    plan: free
    region: frankfurt
    healthCheckPath: /api/health
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: quotestick-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: APP_URL
        fromService:
          name: quotestick
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: CRON_SECRET
        generateValue: true
      - key: SPLITSTICK_WEBHOOK_SECRET
        sync: false
      - key: SHOW_DEV_LINKS
        value: "false"
      - key: DEMO_MODE
        value: "false"
